<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeHer App</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 45, 85, 0.18), transparent 24%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.18), transparent 26%),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: #f8fafc;
      text-align: center;
    }

    .splash-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .splash-logo {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff2d55, #ff5a4d, #ffb347);
      box-shadow:
        0 26px 48px rgba(255, 45, 85, 0.3),
        0 0 0 16px rgba(255, 255, 255, 0.04);
    }

    .splash-logo svg {
      width: 36px;
      height: 36px;
      fill: #fff;
    }

    .splash-brand {
      font-size: 38px;
      font-weight: 820;
      letter-spacing: -0.06em;
    }

    .splash-copy {
      max-width: 280px;
      color: rgba(226, 232, 240, 0.72);
      font-size: 14px;
      line-height: 1.75;
    }

    .splash-loader {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .splash-loader span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .splash-loader span:nth-child(2) {
      animation-delay: 0.14s;
    }

    .splash-loader span:nth-child(3) {
      animation-delay: 0.28s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="splash-shell">
    <div class="splash-logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z"/></svg>
    </div>
    <div class="splash-brand">SafeHer</div>
    <div class="splash-copy">Opening your mobile safety app.</div>
    <div class="splash-loader" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <script>
    const APP_URL = "https://safeher-kabilan-20260323.onrender.com/app.html?source=apk";

    function openSafeHerApp() {
      window.location.replace(APP_URL);
    }

    if (navigator.onLine) {
      setTimeout(openSafeHerApp, 750);
    } else {
      setTimeout(openSafeHerApp, 1250);
    }
  </script>
</body>
</html>
